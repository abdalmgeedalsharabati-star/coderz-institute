<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>معهد coderz - استفسر عن كورس</title>
</head>
<body>

    <header>
        <nav>
            <ul>
                <li><a href="../index.html">الرئيسية</a></li>
                <li><a href="schedule.html">المواعيد</a></li>
                <li><a href="enquiry.html">الاستفسار</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h1>استفسر عن كورس</h1>

        <form action="#">
            <p>
                <label for="full-name">الاسم الكامل</label><br>
                <input type="text" id="full-name" name="full_name" placeholder="مثال: أحمد محمد" autocomplete="name">
            </p>
            <p>
                <label for="email">البريد الإلكتروني</label><br>
                <input type="email" id="email" name="email">
            </p>
            <p>
                <label for="phone">رقم الهاتف</label><br>
                <input type="tel" id="phone" name="phone">
            </p>
            <p>
                <label for="course">الكورس</label><br>
                <select id="course" name="course">
                    <option value="">اختر كورسًا</option>
                    <option value="content">HTML Content</option>
                    <option value="forms">HTML Forms</option>
                </select>
            </p>
            <p>
                <label for="seats">عدد المقاعد</label><br>
                <input type="number" id="seats" name="seats" value="1">
            </p>
            <p>
                <label for="preferred-date">التاريخ المفضّل</label><br>
                <input type="date" id="preferred-date" name="preferred_date">
            </p>
            <p>
                <label for="enquiry-message">نص الاستفسار</label><br>
                <textarea id="enquiry-message" name="message" rows="4" cols="40"></textarea>
            </p>
            <p>
                <button type="submit">إرسال الاستفسار</button>
            </p>
        </form>
    </main>

</body>
</html>
